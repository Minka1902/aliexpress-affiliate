<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Software Analysis Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div id="root"></div>

  <script type="text/babel">
    const data = [
      {
        description: "SSL library",
        matching_strings: [
          { identifier: "$a", offset: 2751, string: "OPENSSL" },
        ],
        name: "OpenSSL",
        open_source: true,
        rule: "OpenSSL",
        versions: [],
        website: "https://www.openssl.org",
      },
      {
        description: "Lighttpd is a web-server optimized for low memory and cpu usage.",
        matching_strings: [
          { identifier: "$a", offset: 2522, string: "lighttpd-1.4.39" },
          { identifier: "$a", offset: 2617, string: "lighttpd-1.4.39" },
          { identifier: "$a", offset: 2718, string: "lighttpd-1.4.39" },
        ],
        name: "lighttpd",
        open_source: true,
        rule: "lighttpd",
        versions: ["1.4.39"],
        website: "https://www.lighttpd.net/",
      },
    ];

    const meta = {
      "Time of Analysis": new Date().toISOString().replace("T", " ").slice(0, 19),
      "Plugin Version": "1.0.0",
      "System Version": "4.5.0",
    };

    function MetaRow({ label, value }) {
      return (
        <tr className="border-b border-gray-200">
          <td className="bg-gray-200 px-4 py-2 font-semibold text-gray-600 w-44">{label}</td>
          <td className="px-4 py-2 text-gray-700">{value}</td>
        </tr>
      );
    }

    function FieldRow({ label, children }) {
      return (
        <div className="flex border-b border-gray-100 last:border-b-0">
          <div className="w-44 min-w-[11rem] bg-gray-100 px-4 py-2 font-semibold text-gray-600 text-sm">
            {label}
          </div>
          <div className="flex-1 px-4 py-2 text-sm text-gray-700">{children}</div>
        </div>
      );
    }

    function MatchedSequences({ strings }) {
      return (
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr>
              <th className="text-left font-bold pb-1 pr-8">identifier</th>
              <th className="text-left font-bold pb-1 pr-8">offset</th>
              <th className="text-left font-bold pb-1">string</th>
            </tr>
          </thead>
          <tbody>
            {strings.map((s, i) => (
              <tr key={i} className="border-t border-gray-100">
                <td className="pr-8 py-1">{s.identifier}</td>
                <td className="pr-8 py-1">{s.offset}</td>
                <td className="py-1">{s.string}</td>
              </tr>
            ))}
          </tbody>
        </table>
      );
    }

    function EntryRow({ item, index }) {
      return (
        <div className="flex border-b-2 border-gray-300">
          <div className="w-14 min-w-[3.5rem] px-4 py-3 bg-gray-50 border-r border-gray-300 font-bold text-gray-500 text-sm">
            {index}
          </div>
          <div className="flex-1">
            <FieldRow label="Software Name">{item.name}</FieldRow>
            <FieldRow label="Rule">{item.rule}</FieldRow>
            <FieldRow label="Version">
              {item.versions.length ? (
                <div className="flex flex-wrap gap-1">
                  {item.versions.map((v) => (
                    <span key={v} className="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded">
                      {v}
                    </span>
                  ))}
                </div>
              ) : (
                <span className="text-gray-400">—</span>
              )}
            </FieldRow>
            <FieldRow label="Description">{item.description}</FieldRow>
            <FieldRow label="Website">
              <a href={item.website} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline">
                {item.website}
              </a>
            </FieldRow>
            <FieldRow label="Open Source">
              <span className="text-blue-600">{item.open_source ? "True" : "False"}</span>
            </FieldRow>
            <FieldRow label="Matched Sequence">
              <MatchedSequences strings={item.matching_strings} />
            </FieldRow>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="max-w-5xl mx-auto bg-white border border-gray-300 shadow-sm">
          {/* Meta header */}
          <table className="w-full border-collapse border-b-2 border-gray-300">
            <tbody>
              {Object.entries(meta).map(([k, v]) => (
                <MetaRow key={k} label={k} value={v} />
              ))}
            </tbody>
          </table>

          {/* Entries */}
          {data.map((item, i) => (
            <EntryRow key={item.name} item={item} index={i} />
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
